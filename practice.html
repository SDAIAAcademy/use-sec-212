<section>
<h2>اليوم 1: التنبؤ والنقل والحشد: احكم في الذروة وحاكِ قبل يوم الحشد</h2>
<ol>
<li><p>متحف تراثي (ليس من حالات الرفادة) يدرس استخدامين: شاشة تتنبأ بزمن الانتظار عند الشباك من عدّ التذاكر، وكاميرات عند المدخل تقدّر عمر الزائر لتطبيق سعر الأطفال آليًا. أيهما أعلى مخاطر، ولماذا؟</p><ul><li><b>أ.</b> الشاشة، لأن كل الزوار يرونها</li><li><b>ب.</b> الكاميرات، لأنها تحلل الوجوه</li><li><b>ج.</b> الشاشة، لأن خطأها يكلف المتحف أكثر</li><li><b>د.</b> متساويان، لأن كليهما آلي بالكامل</li></ul></li>
<li><p>مورِّد يتنبأ بإشغال فنادق مدينة (ليست الرفادة) ويعلن أن متوسط نسبة خطئه 7%. ما المقارنة التي تخبرك هل هذا جيد؟</p><ul><li><b>أ.</b> بنسبة الخطأ في عرض المورِّد السابق</li><li><b>ب.</b> بنسبة خطأ معتادة في قطاع الطيران</li><li><b>ج.</b> بخطأ خط الأساس الموسمي</li><li><b>د.</b> بنطاق الثقة الذي يعلنه المورِّد</li></ul></li>
<li><p>تنبؤ بركاب حافلات مهرجان (ليس من ملفات الرفادة): متوسط نسبة خطئه 4% على الشهر، و15% في أيام المهرجان الخمسة بانحياز إلى الأقل. ستبني المديرة جدول السائقين لأيام المهرجان. أي رقم يحكم؟</p><ul><li><b>أ.</b> 15% في أيام المهرجان، وانحيازه إلى الأقل</li><li><b>ب.</b> 4% على الشهر كله</li><li><b>ج.</b> متوسط الرقمين، نحو 9%</li><li><b>د.</b> 15%، دون حاجة إلى معرفة اتجاهه في تلك الأيام</li></ul></li>
<li><p>ساحة ملعب (ليست ساحة المشرع) تطلق تنبيه الإجهاد الحراري لفرق الميدان حين تتجاوز الحرارة 42 درجة. في يوم رطب بقيت الحرارة 38 ومؤشر الحرارة في فئة «خطر» ساعتين، ولم يُطلق التنبيه. ما الخلل؟</p><ul><li><b>أ.</b> عتبة 42 مرتفعة، ويكفي خفضها إلى 38 درجة</li><li><b>ب.</b> حساس الحرارة معطل ويجب استبداله</li><li><b>ج.</b> يُترك التنبيه لتقدير مشرفي الفرق</li><li><b>د.</b> التنبيه يقرأ الحرارة وحدها، لا مؤشر الحرارة الذي يجمعها مع الرطوبة</li></ul></li>
<li><p>مكتبان استشاريان حاكيا خطة البوابات نفسها لمحطة قطار (ليست ساحة المشرع). الأول يقول إن القمة 1.9 شخص/م²، والثاني 3.4. المدخلات واحدة. ما أول ما تسأل عنه؟</p><ul><li><b>أ.</b> أي أداة محاكاة استخدم كل مكتب</li><li><b>ب.</b> أي التقريرين أحدث تاريخًا</li><li><b>ج.</b> منطقة القياس ونافذة الزمن</li><li><b>د.</b> لا شيء، نعتمد الرقم الأعلى من التقريرين احتياطًا</li></ul></li>
<li><p>فريق يقارن خطتين لمدخل معرض (ليس ساحة المشرع). شغّل الخطة الأولى بالبذرة 1 و2,000 زائر، والثانية بالبذرة 5 و1,800 زائر، فكانت الثانية أدنى قمة. ماذا تطلب قبل أن تقبل النتيجة؟</p><ul><li><b>أ.</b> تشغيل الخطة الثانية مرتين أخريين بالبذرة 5 نفسها</li><li><b>ب.</b> تشغيل الخطتين بالزوار أنفسهم وبالبذور نفسها</li><li><b>ج.</b> رأي مهندس في أي المخططين أوضح</li><li><b>د.</b> حساب القمة بمتوسط دقيقة بدل عشر ثوانٍ</li></ul></li>
<li><p>لممر مشاة إلى ملعب (ليس ساحة المشرع) خطتان. في اليوم المعتاد: الأولى 1.4 والثانية 1.6، والحد 2.0. مع زيادة الربع: الأولى 2.6 والثانية 2.1. مع مخرج مغلق: الأولى 3.5 والثانية 2.4. أيها تختار؟</p><ul><li><b>أ.</b> الأولى، لأنها أدنى في اليوم المعتاد</li><li><b>ب.</b> لا هذه ولا تلك، فكلتاهما تتجاوز الحد</li><li><b>ج.</b> تُجرَّب الخطتان في يوم مباراة ثم يُختار</li><li><b>د.</b> الثانية، مع إجراء مكتوب لظرفي الضغط</li></ul></li>
<li><p>في مدخل معرض (ليس ساحة المشرع) توقف نظام عدّ الكثافة، وأبلغ مشرف البوابة أن الطابور يمتد ويضغط. خطة السلامة تسمّي مدير العمليات المناوب صاحبًا لقرار الإيقاف. ماذا يحدث؟</p><ul><li><b>أ.</b> يقرر مدير العمليات المناوب من العدّ اليدوي وبلاغ المشرف</li><li><b>ب.</b> لا قرار حتى يعود النظام ويؤكد الكثافة</li><li><b>ج.</b> يوقف المشرف الدخول بنفسه لأنه يرى الطابور</li><li><b>د.</b> يتصل المدير بالمورِّد ليقدّر الكثافة عن بعد</li></ul></li>
<li><p>محطة حافلات في مدينة أخرى تدرس نظامين لقياس زمن الانتظار: شاشة تحسبه من مواقع الحافلات على الطريق، وحساسات تلتقط إشارات هواتف المنتظرين وتعدّها بمعرّف مشفر لكل جهاز. أي النظامين يجمع بيانات عن أناس لم يستخدموه؟</p><ul><li><b>أ.</b> الشاشة، لأن كل المنتظرين يرونها</li><li><b>ب.</b> الحساسات، فمعرّفها المشفر يتبع كل جهاز</li><li><b>ج.</b> الشاشة، لأن موقع الحافلة بيانات موقع</li><li><b>د.</b> لا أحدهما، فالمعرّف المشفر لا يدل على أحد</li></ul></li>
<li><p>نظام لتوقع أعداد زوار حديقة عامة لا يلمس أي بيانات شخصية. أخطأ إلى الأقل في يوم عيد، فقلّ المسعفون والماء في يوم حار. كيف تقدّر مخاطره؟</p><ul><li><b>أ.</b> منخفضة في الخصوصية، وقد ترتفع في السلامة</li><li><b>ب.</b> منخفضة في كل شيء، لأنه لا يلمس أي بيانات شخصية</li><li><b>ج.</b> مرتفعة في الخصوصية، لأنه يعدّ الزوار</li><li><b>د.</b> لا تُقدّر قبل أن يقع حادث</li></ul></li>
<li><p>تنبؤ بزوار متحف يخطئ بمتوسط 6% على السنة، والطريقة الموسمية البسيطة (العام الماضي في اليوم نفسه) تخطئ 6.5% على الأيام نفسها. ماذا تستنتج؟</p><ul><li><b>أ.</b> التنبؤ ممتاز، فخطؤه أقل من 10%</li><li><b>ب.</b> لا يضيف إلا قليلًا على الطريقة البسيطة</li><li><b>ج.</b> الطريقة البسيطة أفضل، لأنها أرخص</li><li><b>د.</b> لا يمكن الحكم قبل معرفة طريقة عمل النموذج</li></ul></li>
<li><p>تنبؤ بركاب قطار يخطئ 4% على الشهر، و14% في أيام موسم المعارض بانحياز إلى الأقل. ستُبنى جداول الموظفين لأيام الموسم. أي رقم يحكم؟</p><ul><li><b>أ.</b> 4%، لأنه على الشهر كله</li><li><b>ب.</b> متوسط الرقمين</li><li><b>ج.</b> 14% وانحيازه إلى الأقل</li><li><b>د.</b> لا هذا ولا ذاك، بل دقة النموذج المعلنة</li></ul></li>
<li><p>في يوم ذروة تنبأ النظام بـ 800 زائر، وجاء 1,000. ما الهامش الذي يُضاف إلى التنبؤ ليغطي هذا اليوم؟</p><ul><li><b>أ.</b> 20%، لأن النقص خُمس الفعلي</li><li><b>ب.</b> 10%، فهو نصف النقص احتياطًا كافيًا</li><li><b>ج.</b> 200 زائر في كل الأيام</li><li><b>د.</b> 25%، أي 1,000 ÷ 800 ناقص 1</li></ul></li>
<li><p>مهرجان في ساحة مفتوحة: أحر ساعة الساعة 13 وفئتها «خطر»، وساعة الذروة في الوصول الساعة 18 وفئتها «حذر». الساعتان 15 و16 فئتهما «حذر شديد» وتحمل كل منهما 9% من الوافدين. أين تضع فرق الماء والظل الإضافية أولًا؟</p><ul><li><b>أ.</b> في الساعة 13 وحدها، فهي أحر ساعة</li><li><b>ب.</b> في الساعة 18 وحدها، فهي ساعة الذروة</li><li><b>ج.</b> في الساعات 15 و16 حيث يجتمع الحر والزحام</li><li><b>د.</b> بالتساوي على ساعات اليوم كلها</li></ul></li>
<li><p>مكتب استشاري يقدّم محاكاة لخطة بوابات ملعب، ويذكر أن قمة الكثافة 1.2 شخص/م² محسوبة على منطقة 20 × 15 مترًا أمام البوابات. خطة السلامة تعرّف القياس على مستطيل 8 × 5 أمتار أمام كل بوابة. ماذا تفعل بالرقم؟</p><ul><li><b>أ.</b> تطلب إعادة الحساب على منطقة خطة السلامة</li><li><b>ب.</b> تقبله، فهو أدنى كثيرًا من الحد</li><li><b>ج.</b> تضربه في نسبة المساحتين لتصل إلى الرقم الصحيح</li><li><b>د.</b> تقبله، فالمنطقة الأكبر أصدق تمثيلًا للساحة</li></ul></li>
<li><p>قارن فريق خطتين لمدخل معرض: الأولى بالبذرة 1 و1,500 زائر، والثانية بالبذرة 4 و1,300 زائر، فكانت الثانية أدنى قمة. ما الذي ينقص المقارنة؟</p><ul><li><b>أ.</b> تشغيل الثانية مرات أكثر بالبذرة 4 نفسها</li><li><b>ب.</b> الزوار أنفسهم والبذور نفسها للخطتين</li><li><b>ج.</b> رسم أوضح لمخطط الخطتين</li><li><b>د.</b> نافذة زمنية أطول للقياس</li></ul></li>
<li><p>محاكاة خطتين لمدخل ملعب بالحد 2.0. في الخطة الأولى تبلغ القمة 2.4 لعشر ثوانٍ بعد كل قطار ثم تنزل قبل التالي. في الثانية تبلغ القمة 2.2، لكنها تبقى فوق 2.0 ثلاث دقائق وتعلو مع كل قطار. أيهما أدعى إلى القلق؟</p><ul><li><b>أ.</b> الأولى، لأن قمتها أعلى</li><li><b>ب.</b> متساويتان، فكلتاهما تتجاوز الحد</li><li><b>ج.</b> الأولى، لأن تجاوزها يتكرر مع كل قطار</li><li><b>د.</b> الثانية، لأن الكثافة فيها تتراكم</li></ul></li>
<li><p>خطة سلامة مهرجان تقول: إذا تجاوزت الكثافة 2.5 لدقيقة يوقف مدير العمليات الدخول. أظهر العداد 2.6 لدقيقتين، ومشرف في الموقع يرى أن الحركة تجري. ماذا يحدث؟</p><ul><li><b>أ.</b> ينتظر المدير رأي المشرف لأنه في الموقع</li><li><b>ب.</b> يوقف المدير الدخول كما كُتب، ثم يتحقق</li><li><b>ج.</b> يوقف النظام الدخول آليًا دون أي إنسان</li><li><b>د.</b> يُرفع الحد إلى 3.0 ما دامت الحركة تجري</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: المساعد والطاقة والخصوصية والخريطة</h2>
<ol>
<li><p>مدير منشأة فعاليات (ليست الرفادة) يعرض خطة بوابات حوكيت بالعدد المتوقع وحده، فكانت قمة الكثافة 1.7 والحد 2.0. تنبؤه يخطئ في الذروة بنحو 20% إلى الأقل. ماذا تطلب؟</p><ul><li><b>أ.</b> لا شيء، فالقمة تحت الحد بهامش</li><li><b>ب.</b> تنبؤًا أدق من مورِّد آخر</li><li><b>ج.</b> تشغيلًا بزيادة الخُمس وببوابة مغلقة</li><li><b>د.</b> حدًا أدنى للكثافة، مثلًا 1.5، احتياطًا</li></ul></li>
<li><p>مساعد متحف (ليس «مِضياف»). سُئل: «طفلي اختفى بين القاعات». أجاب: «القاعات متصلة، فغالبًا هو قريب. انظر في قاعة الأطفال أولًا، ثم اتصل بأمن المتحف على 1200 إن لم تجده». الرقم صحيح. ما تقديرها؟</p><ul><li><b>أ.</b> صحيحة، لأن الرقم الصحيح فيها</li><li><b>ب.</b> إحالة فاشلة، لأن الإحالة جاءت بعد نصيحة بالبحث</li><li><b>ج.</b> خاطئة، لأن قاعة الأطفال اقتراح غير مؤكد</li><li><b>د.</b> صحيحة، لأن لهجتها هادئة ومطمئنة</li></ul></li>
<li><p>فريقك يختبر مساعد محطة قطار (ليس «مِضياف») بالبنغالية، ولا أحد فيه يقرؤها. ما الطريقة التي تعتمدها لتقدير الإجابات؟</p><ul><li><b>أ.</b> ترجمتها آليًا ثم تقديرها بالعربية</li><li><b>ب.</b> مقارنة طولها وأرقامها بطول الإجابة العربية</li><li><b>ج.</b> سؤال المساعد نفسه عن معنى إجابته</li><li><b>د.</b> ترجمة عكسية من مترجم معتمد، ثم الصحيفة</li></ul></li>
<li><p>مساعد مطار (ليس «مِضياف»)، والقاعدة: 9 من 10 على الأقل ولا إحالة فاشلة. النتائج: التركية 10 من 10 بلا إحالة فاشلة؛ الفارسية 9 من 10 وفيها إحالة فاشلة؛ الفرنسية 8 من 10 بلا إحالة فاشلة. أيها تُشغَّل؟</p><ul><li><b>أ.</b> التركية وحدها</li><li><b>ب.</b> التركية والفارسية</li><li><b>ج.</b> الثلاث، لأن مجموعها 27 من 30</li><li><b>د.</b> التركية والفرنسية</li></ul></li>
<li><p>مورِّد نظام إنارة ذكي لمبنى بلدية (ليس مركز زوار الرفادة) يقول: «خفضنا الاستهلاك 15% مقارنة بالأشهر نفسها من العام الماضي». في السنة نفسها نُقل نصف الموظفين إلى مبنى آخر. ما المشكلة الأولى في الرقم؟</p><ul><li><b>أ.</b> الفترة قصيرة لا تكفي للحكم</li><li><b>ب.</b> الرقم من الفواتير لا من النظام نفسه</li><li><b>ج.</b> نقل الموظفين يخفض الاستهلاك وحده</li><li><b>د.</b> لم تُراعَ فصول السنة</li></ul></li>
<li><p>مبنى إداري (ليس مركز زوار الرفادة): خط الأساس المعدّل بالطقس والإشغال يتوقع 1,000,000 كيلوواط ساعة بعد تشغيل نظام تكييف ذكي، والفعلي 880,000. في الفترة نفسها وفّرت الإنارة الموفرة 50,000 بقياس عداد فرعي. كم يُنسب إلى النظام؟</p><ul><li><b>أ.</b> 12%</li><li><b>ب.</b> 7%</li><li><b>ج.</b> 17%</li><li><b>د.</b> 5%</li></ul></li>
<li><p>متحف (ليس من الرفادة) يريد أن يعرف عدد الزوار في كل قاعة في كل ساعة، ليوزع الحراس في الموسم القادم. لا يحتاج إلى رقم لحظي ولا إلى هوية أحد. أي خيار تختار؟</p><ul><li><b>أ.</b> عدّ الهواتف في كل قاعة بمعرّف مشفر لكل جهاز</li><li><b>ب.</b> التعرف على الوجوه ليُعدّ كل زائر مرة واحدة</li><li><b>ج.</b> كاميرات تحلل الفيديو وتحفظه شهرًا للتحقق</li><li><b>د.</b> عدّ يدوي كل ساعة في أسابيع ممثلة للموسم</li></ul></li>
<li><p>كاميرات ممر في ملعب (ليس ساحة المشرع) تعدّ الكثافة على الجهاز، ويحفظ المورِّد التسجيل سنة «لتدريب النظام لاحقًا». غرض الجمع إدارة الحشد يوم المباراة والتحقيق في أي حادث يُبلَّغ عنه. ما مدة الحفظ السليمة؟</p><ul><li><b>أ.</b> أقصر مدة تكفي للتحقيق في حادث، ثم الحذف</li><li><b>ب.</b> سنة كما يطلب المورِّد، لأن التدريب يحسن الدقة</li><li><b>ج.</b> لا حفظ، ويُحذف التسجيل فور انتهاء المباراة</li><li><b>د.</b> ما دام النظام يعمل، لأن الأعداد تُحفظ</li></ul></li>
<li><p>خريطة لمطار (ليس الرفادة) فيها حالة: «بوابات صعود بمسح الوجه»، قيمتها 3 وجاهزيتها 3 ومخاطرها 3، ولا ضوابط مكتوبة ولا صاحب قرار مسمّى. ماذا تفعل بها؟</p><ul><li><b>أ.</b> تبقى في مكانها، فأولويتها 3</li><li><b>ب.</b> تُحذف من الخريطة</li><li><b>ج.</b> تنزل إلى أسفل الخريطة حتى تُكتب ضوابطها ويُسمّى صاحب قرارها</li><li><b>د.</b> تُخفض مخاطرها إلى 2 لأن الركاب يوافقون</li></ul></li>
<li><p>أي البيانات التالية يعدّها نظام حماية البيانات الشخصية بيانات حساسة؟</p><ul><li><b>أ.</b> عدد الداخلين إلى ساحة في كل دقيقة</li><li><b>ب.</b> رقم هاتف مسجّل لحجز تذكرة</li><li><b>ج.</b> بصمة وجه لتحديد هوية الزائر</li><li><b>د.</b> درجة حرارة الجو في كل ساعة</li></ul></li>
<li><p>مورِّد يعرض على منشأة معارض نظامًا يطابق وجوه الداخلين بقائمة ممنوعين، ويحفظ صور كل الداخلين سنة «لتحسين الدقة». أي ما يلي يلزم قبل أي تجربة، بحسب اللائحة التنفيذية لنظام حماية البيانات الشخصية؟</p><ul><li><b>أ.</b> موافقة المورِّد على حذف الصور عند الطلب</li><li><b>ب.</b> لافتة عند المدخل تقول إن المكان مراقب</li><li><b>ج.</b> اختبار دقة المطابقة في مختبر المورِّد</li><li><b>د.</b> تقييم أثر مكتوب، لأنها بيانات حساسة</li></ul></li>
<li><p>مساعد محطة حافلات سُئل: «أبي سقط ولا يتحرك». أجاب: «ضعه في وضع مريح وابقَ معه، ثم اتصل بالإسعاف 997 إن لم يتحسن». ما تقديرها؟</p><ul><li><b>أ.</b> صحيحة، لأن رقم الإسعاف فيها صحيح</li><li><b>ب.</b> إحالة فاشلة، فالإحالة متأخرة</li><li><b>ج.</b> خاطئة، لأن النصيحة غير طبية</li><li><b>د.</b> صحيحة، لأن لهجتها مطمئنة</li></ul></li>
<li><p>فريقك يختبر مساعد مطار بالسواحيلية، ولا أحد فيه يقرؤها. كيف تقدّر الإجابات؟</p><ul><li><b>أ.</b> بترجمتها آليًا ثم تقديرها</li><li><b>ب.</b> بمقارنة طولها بطول الإجابة الإنجليزية نفسها</li><li><b>ج.</b> بترجمة عكسية معتمدة ثم صحيفة الحقائق</li><li><b>د.</b> بسؤال المساعد عن معنى إجابته</li></ul></li>
<li><p>اختُبر مساعد مطار بخمس لغات. وقعت إحالة فاشلة في سؤال «طفل تائه» بالأردية والإندونيسية والبنغالية، وأخطأ المساعد في سعر الحافلة بالفرنسية ثلاث مرات. ما الذي يُصلح أولًا؟</p><ul><li><b>أ.</b> أسعار الحافلة بالفرنسية، فهي أكثر الأخطاء</li><li><b>ب.</b> الإجابات الأربع الفاشلة وحدها، ثم تُعاد هي</li><li><b>ج.</b> قاعدة الإحالة في أسئلة الطفل التائه</li><li><b>د.</b> إيقاف اللغات الثلاث نهائيًا</li></ul></li>
<li><p>مساعد سُئل بالفرنسية عن أقرب صيدلية، فأجاب بالإنجليزية إجابة صحيحة. ما تقديرها؟</p><ul><li><b>أ.</b> صحيحة، فالمعلومة صحيحة</li><li><b>ب.</b> خاطئة، فالمعلومة لا تُعتمد</li><li><b>ج.</b> إحالة فاشلة</li><li><b>د.</b> لغة أخرى</li></ul></li>
<li><p>خط أساس لاستهلاك مبنى بُني من سنة لم تتجاوز فيها درجات التبريد اليومية 12. بعد تشغيل نظام التكييف الذكي جاء صيف بلغت فيه 15 في أيام كثيرة. ما الذي تكتبه في حكمك على التوفير في تلك الأيام؟</p><ul><li><b>أ.</b> التوفير فيها أصدق، لأن الحر أشد</li><li><b>ب.</b> المتوقع فيها تخمين خارج مدى سنة الأساس</li><li><b>ج.</b> تُحذف متغيرات الطقس وتُستعمل المقارنة الخام</li><li><b>د.</b> التوفير فيها أقل من الحقيقة بالضرورة</li></ul></li>
<li><p>ادعاء: «خفض النظام الاستهلاك 20% مقارنة بالأشهر نفسها من العام الماضي». ملف العداد فيه 160 يومًا بعد التشغيل مقابل 182 قبله. ما أول ما تصلحه؟</p><ul><li><b>أ.</b> مقارنة المجموع وعدد الأيام مختلف</li><li><b>ب.</b> أن الأشهر نفسها لا تضبط أثر الموسم</li><li><b>ج.</b> أن الرقم من فواتير العداد</li><li><b>د.</b> أن الفترة سنة واحدة فقط</li></ul></li>
<li><p>في خريطة مطار حالتان أولويتهما 3: «لوحة طوابير من عدّ الرحلات» مخاطرها 1، و«بوابات بمسح الوجه» مخاطرها 2 بضوابط مكتوبة. قاعدة الخريطة عند التساوي: الأقل مخاطر أولًا. أيهما تتقدم؟</p><ul><li><b>أ.</b> البوابات، فقيمتها أعلى على الأرجح</li><li><b>ب.</b> تُدمجان في حالة واحدة</li><li><b>ج.</b> يختار المورِّد أيهما أنفع</li><li><b>د.</b> لوحة الطوابير</li></ul></li>
<li><p>مقترح لإيجاد الأطفال التائهين في حديقة عامة بمطابقة وجوههم في كل الكاميرات. أي بديل أقل تدخلًا يلبي الحاجة؟</p><ul><li><b>أ.</b> المقترح نفسه مع حفظ البصمات شهرًا</li><li><b>ب.</b> سوار برقم ولي الأمر ونقطة لقاء</li><li><b>ج.</b> تتبع هواتف الأهل لمعرفة مكانهم</li><li><b>د.</b> منع دخول الأطفال دون العاشرة</li></ul></li>
</ol>
